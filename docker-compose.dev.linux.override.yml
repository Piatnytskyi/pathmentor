version: '3.4'

services:
  pathmentormodeldatabase:
    image: postgres:alpine
    container_name: pathmentor.model.database
    environment:
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pathmentormodel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  pathmentormodelapi:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=80
      - ASPNETCORE_HTTPS_PORTS=443
      - ConnectionStrings__DefaultConnection=Host=pathmentor.model.database; Port=5432; Database=pathmentormodel; Username=${POSTGRES_USER}; Password=${POSTGRES_PASSWORD}; CommandTimeout=120;
    build:
      context: .
      dockerfile: PathMentor.Model.API/Dockerfile
      args:
        - configuration=Debug
    ports:
      - "5000:80"
      - "5001:443"
    volumes:
      - $HOME/.microsoft/usersecrets:/root/.microsoft/usersecrets:ro
      - $HOME/.aspnet/https:/root/.aspnet/https:ro
      - $HOME/.kaggle:/root/.kaggle/:ro
      - $HOME/.vsdbg:/remote_debugger:rw
    depends_on:
      pathmentormodeldatabase:
        condition: service_healthy
