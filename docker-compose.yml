# docker compose -f docker-compose.yml -f docker-compose.*.override.yml --env-file *.env up -d

version: '3.4'

services:
  pathmentormodelapi:
    image: ${DOCKER_REGISTRY-}pathmentor.model.api
    container_name: pathmentor.model.api
    build:
      context: .
      dockerfile: pathmentor_dataset_cli/Dockerfile
    healthcheck:
      test: ["CMD-SHELL", "curl -k --fail https://localhost/health || exit"]
      interval: 60s
      timeout: 5s
      retries: 5
